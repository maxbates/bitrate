# The ship gate (spec §8), enforced on every commit: someone with nothing but
# the public repo runs `bash serve.sh` and it works, offline, first try (and
# `bash run.sh`, rule 5's artifact, opens the deployed game). (There
# is no ZIP any more — the submission is the deployed site plus this repo — so
# the gate copies a clean tree instead of unzipping a bundle.) Linux runners
# are the brief's guaranteed platform; x86_64 and arm64 both run the full gate.
name: gate

on:
  push:
  pull_request:

jobs:
  test:
    name: go tests (stdlib-only, offline policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false # stdlib-only module: no go.sum to key a cache on
      - run: go vet ./...
      - run: go vet -tags ship ./...
      - run: go test ./...
      - run: go test -tags ship ./server

  ship-gate:
    name: ship gate (${{ matrix.runner }})
    strategy:
      fail-fast: false # arm and x86 legs are independent evidence
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false # stdlib-only module: no go.sum to key a cache on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lab/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python ship_gate.py
        working-directory: lab
      # voice-babble's mic trigger is measured per player rather than guessed
      # (spec §5). Nobody can test that by hand without a microphone, so it is
      # driven headlessly over synthetic frames on the runner that already has
      # Chromium.
      - run: python voice_level_check.py
        working-directory: lab
      # Two more browser suites over the game that ships. Both guard bugs that
      # were invisible to every other test because the code and the on-screen
      # copy disagreed with each other rather than either being wrong alone.
      - run: python drum_pad_mouse_test.py
        working-directory: lab
      - run: python acc_hint_test.py
        working-directory: lab

  # Minimal-container leg: no glibc, no xdg-open, network disabled — proves
  # the static binary runs anywhere and the URL-printing fallback carries
  # the day when browser-open fails (spec §8 gate step 6).
  container:
    name: static binary in netless alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false # stdlib-only module: no go.sum to key a cache on
      # There is no ZIP to unzip any more (spec §8): build the same static
      # linux/amd64 binary the public instance runs and mount it straight in.
      - run: ./build.sh deploy
      - run: |
          mkdir -p dist/gate-container/bin
          cp dist/bitrate-linux-amd64 dist/gate-container/bin/
          docker run --rm --network=none -v "$PWD/dist/gate-container:/app" -w /app \
            alpine:3.20 sh -c '
              set -e
              chmod +x bin/bitrate-linux-amd64
              # No -no-browser: xdg-open is absent, and that must be harmless.
              bin/bitrate-linux-amd64 >/tmp/out.log 2>&1 &
              for i in $(seq 1 100); do
                URL=$(grep -o "http://127.0.0.1:[0-9]*/" /tmp/out.log | head -1 || true)
                [ -n "$URL" ] && break
                sleep 0.2
              done
              [ -n "$URL" ] || { cat /tmp/out.log; echo "no URL printed"; exit 1; }
              wget -qO- "$URL"env/stream-typing/ | grep -q "stream-viewport"
              wget -qO- "$URL"env/stream-typing/game.js >/dev/null
              echo "container leg OK: $URL served offline without glibc or xdg-open"
            '

  # A macOS leg covers the courtesy path (quarantine-simulation lives in the
  # manual pre-submit ritual); non-blocking per spec §8.
  macos-courtesy:
    name: macOS courtesy path
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false # stdlib-only module: no go.sum to key a cache on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lab/requirements.txt
      - run: python -m playwright install chromium
      - run: python ship_gate.py
        working-directory: lab
