<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — pixel lens</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="../common/results.css">
</head>
<body>
  <!-- Top bar: the honest accounting, always visible — viewport resolution
       and the derived alphabet. N is the hitbox grid, not raw pixels: any
       click inside a cell selects it, so cells are the distinguishable
       selections (spec §5 pixel-lens). -->
  <div id="topbar">
    <div id="corner">
      <div id="mode-banner" class="mode-practice">practice</div>
      <div id="mode-help"></div>
    </div>
    <div id="res-info"></div>
    <div id="hud">
      <div id="hud-spark" class="hud-spark-host"></div>
      <div id="hud-metrics">
        <div id="hud-bps">0.0 <span class="hud-unit">bits/s</span></div>
        <div id="hud-time"></div>
        <div id="hud-counts"></div>
      </div>
    </div>
  </div>

  <main id="field">
    <div id="gridarea"></div>
    <!-- Look-ahead layer. The SVG is first so the order path paints under the
         preview marks; the marks themselves are pooled and placed by JS. -->
    <div id="previews">
      <svg id="preview-path" aria-hidden="true"></svg>
    </div>
    <div id="target" hidden>
      <div class="fill"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
    </div>
    <div id="loupe" hidden>
      <canvas id="loupe-canvas"></canvas>
      <div id="loupe-arrow" hidden>▸</div>
    </div>
  </main>

  <div id="notice" hidden></div>

  <section id="results" hidden>
    <div id="res-hero"></div>
    <div id="res-tiles"></div>
    <div id="res-charts">
      <figure>
        <figcaption>pace — net bits/s per 5&thinsp;s <span class="err-key">▎misses</span></figcaption>
        <div id="chart-pace"></div>
      </figure>
      <figure>
        <figcaption>gap between selections</figcaption>
        <div id="chart-iki"></div>
      </figure>
    </div>
    <div id="res-footer">press <b>Enter</b> for a new scored run · <b>Esc</b> for practice</div>
  </section>

  <div id="overlay" hidden>
    <div id="card"></div>
  </div>

  <!-- Settings: cell size drives N and lens magnification; every change is
       a new content-addressed variant. -->
  <button id="gear" title="settings">⚙ settings</button>
  <div id="sheet">
    <div class="sh-row">
      <span class="sh-label">input</span>
      <div class="seg" id="seg-input">
        <button data-v="mouse">mouse + loupe</button>
        <button data-v="touch">touch (tablet)</button>
        <!-- Hybrid: press to aim under the loupe, lift to select. -->
        <button data-v="hybrid">touch + loupe · lift</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">cell size</span>
      <!-- options depend on input mode; populated by renderCellSeg() -->
      <div class="seg" id="seg-cell"></div>
    </div>
    <div class="sh-row">
      <span class="sh-label">look-ahead</span>
      <div class="seg" id="seg-preview">
        <button data-v="0">off</button>
        <button data-v="1">1</button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
      </div>
    </div>
    <div class="sh-row" id="row-zoom">
      <span class="sh-label">lens zoom</span>
      <div class="seg" id="seg-zoom">
        <button data-v="auto">auto</button>
        <button data-v="2">2×</button>
        <button data-v="3">3×</button>
        <button data-v="4">4×</button>
        <button data-v="6">6×</button>
      </div>
    </div>
    <div class="sh-row" id="row-lens">
      <span class="sh-label">lens size</span>
      <div class="seg" id="seg-lens">
        <button data-v="80">small</button>
        <button data-v="110">medium</button>
        <button data-v="150">large</button>
      </div>
    </div>
    <div class="sh-foot" id="sheet-info"></div>
  </div>

<script src="../common/results.js"></script>
<script src="game.js"></script>
</body>
</html>
