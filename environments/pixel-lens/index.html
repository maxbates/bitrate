<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — pixel lens</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="../common/results.css">
</head>
<body>
  <!-- Header band (spec §4.3.1): mode + run controls on the left, the honest
       accounting in the middle with the settings button under it — viewport
       resolution and the derived alphabet; N is the hitbox grid, not raw
       pixels, since any click inside a cell selects it (spec §5 pixel-lens) —
       and on the right the figures the assignment requires: running bits/s at
       >=1 Hz plus N / Sc / Si (rules 3 and 4), with the pace graph. -->
  <header id="topbar">
    <div id="mode-banner" class="mode-practice">practice</div>
    <div id="mode-help"></div>
    <div id="cfg">
      <div id="res-info"></div>
      <button type="button" class="act click" data-act="settings"><span class="chip">⚙</span><span class="lbl">settings</span></button>
    </div>
    <div id="hud" aria-live="off">
      <div id="hud-spark" class="hud-spark-host"></div>
      <div id="hud-metrics">
        <div id="hud-bps">0.0 <span class="hud-unit">bits/s</span></div>
        <div id="hud-time"></div>
        <div id="hud-counts"></div>
      </div>
    </div>
  </header>

  <main id="field">
    <div id="gridarea"></div>
    <div id="previews"></div>
    <div id="target" hidden>
      <div class="fill"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
    </div>
    <div id="loupe" hidden>
      <canvas id="loupe-canvas"></canvas>
      <div id="loupe-arrow" hidden>▸</div>
    </div>
  </main>

  <div id="notice" hidden></div>

  <section id="results" hidden>
    <div id="res-hero"></div>
    <div id="res-tiles"></div>
    <div id="res-charts">
      <figure>
        <figcaption>pace — net bits/s per 5&thinsp;s <span class="err-key">▎misses</span></figcaption>
        <div id="chart-pace"></div>
      </figure>
      <figure>
        <figcaption>gap between selections</figcaption>
        <div id="chart-iki"></div>
      </figure>
    </div>
    <div id="res-footer">
      <button type="button" class="act click" data-act="arm"><kbd>Enter</kbd>new scored run</button>
      <button type="button" class="act click" data-act="seed"><kbd>Esc</kbd>back to practice</button>
      <button type="button" class="act click" data-act="settings"><span class="chip">⚙</span>settings</button>
    </div>
  </section>

  <div id="overlay" hidden>
    <div id="card"></div>
  </div>

  <!-- Settings: cell size drives N and lens magnification; every change is
       a new content-addressed variant. No input row — pixel lens is the mouse
       game and drum pad is the touch one, so the modality is fixed by which
       page you opened. -->
  <a id="gallery-link" href="/env/" title="back to all games">← gallery</a>
  <div id="sheet">
    <div class="sh-row">
      <span class="sh-label">cell size</span>
      <!-- options depend on input mode; populated by renderCellSeg() -->
      <div class="seg" id="seg-cell"></div>
    </div>
    <div class="sh-row">
      <span class="sh-label">look-ahead</span>
      <div class="seg" id="seg-preview">
        <button data-v="0">off</button>
        <button data-v="1">1</button>
        <button data-v="2">2</button>
        <button data-v="3">3</button>
      </div>
    </div>
    <div class="sh-row" id="row-zoom">
      <span class="sh-label">lens zoom</span>
      <div class="seg" id="seg-zoom">
        <button data-v="auto">auto</button>
        <button data-v="2">2×</button>
        <button data-v="3">3×</button>
        <button data-v="4">4×</button>
        <button data-v="6">6×</button>
      </div>
    </div>
    <div class="sh-row" id="row-lens">
      <span class="sh-label">lens size</span>
      <div class="seg" id="seg-lens">
        <button data-v="80">small</button>
        <button data-v="110">medium</button>
        <button data-v="150">large</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">sound</span>
      <div class="seg" id="seg-audio">
        <button data-v="on">on</button>
        <button data-v="off">off</button>
      </div>
    </div>
    <div class="sh-foot" id="sheet-info"></div>
  </div>

<script src="../common/results.js"></script>
<script src="game.js"></script>
</body>
</html>
