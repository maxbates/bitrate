<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — beat hands</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="../common/results.css">
</head>
<body>
  <div id="corner">
    <div id="mode-banner" class="mode-practice">practice</div>
    <div id="mode-help"></div>
  </div>

  <div id="hud">
    <div id="hud-bps">0.0 <span class="hud-unit">bits/s</span></div>
    <div id="hud-time"></div>
    <div id="hud-counts"></div>
  </div>

  <!-- The whole game field is one canvas: highway, notes, hit line,
       webcam preview + motion overlay, feedback. One rAF loop owns the
       frame clock, which is what hit-window judging wants. -->
  <canvas id="field"></canvas>
  <video id="cam" playsinline muted hidden></video>

  <div id="notice" hidden></div>

  <section id="results" hidden>
    <div id="res-hero"></div>
    <!-- Scored-run recording (camera input): the composited canvas replayed.
         Local-only — the file leaves the browser only via the download link. -->
    <figure id="res-video-wrap" hidden>
      <video id="res-video" controls loop playsinline></video>
      <figcaption><a id="res-video-dl" download>⬇ download your run — stays on this machine until you share it</a></figcaption>
    </figure>
    <div id="res-tiles"></div>
    <div id="res-charts">
      <figure>
        <figcaption>pace — net bits/s per 5&thinsp;s <span class="err-key">▎misses</span></figcaption>
        <div id="chart-pace"></div>
      </figure>
      <figure>
        <figcaption>gap between selections</figcaption>
        <div id="chart-iki"></div>
      </figure>
    </div>
    <div id="res-footer">press <b>Enter</b> for a new scored run · <b>Esc</b> for practice</div>
  </section>

  <div id="overlay" hidden>
    <div id="card"></div>
  </div>

  <button id="gear" title="settings">⚙ settings</button>
  <div id="sheet">
    <div class="sh-row">
      <span class="sh-label">input</span>
      <div class="seg" id="seg-input">
        <button data-v="camera">camera swipes</button>
        <button data-v="keys">keys (wasd + arrows)</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">directions</span>
      <div class="seg" id="seg-dirs">
        <button data-v="4">4</button>
        <button data-v="8">8 (camera only)</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">tempo</span>
      <div class="seg" id="seg-tempo">
        <button data-v="60">60/min</button>
        <button data-v="90">90</button>
        <button data-v="120">120</button>
        <button data-v="150">150</button>
        <button data-v="180">180</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">hit window</span>
      <div class="seg" id="seg-window">
        <button data-v="200">±200 ms</button>
        <button data-v="300">±300</button>
        <button data-v="400">±400</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">metronome</span>
      <div class="seg" id="seg-tick">
        <button data-v="on">tick</button>
        <button data-v="off">off</button>
      </div>
    </div>
    <div class="sh-row" id="row-rec">
      <span class="sh-label">record runs</span>
      <div class="seg" id="seg-rec">
        <button data-v="overlay">game + camera</button>
        <button data-v="camera">camera only</button>
        <button data-v="off">off</button>
      </div>
    </div>
    <div class="sh-row" id="row-sens">
      <span class="sh-label">swipe trigger</span>
      <div class="seg" id="seg-sens">
        <button data-v="high">sensitive</button>
        <button data-v="med">medium</button>
        <button data-v="low">busy room</button>
      </div>
    </div>
    <div class="sh-foot" id="cam-stats"></div>
    <div class="sh-foot" id="sheet-info"></div>
  </div>

<script src="../common/results.js"></script>
<script src="game.js"></script>
</body>
</html>
