<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — stream typing</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="../common/results.css">
</head>
<body>
  <!-- Header band (spec §4.3.1): mode + run controls on the left, what this
       variant is set to in the middle (with the settings button under it), and
       on the right the figures the assignment requires — running bits/s at
       >=1 Hz plus N / Sc / Si (rules 3 and 4) — with the pace graph. It is an
       in-flow band: the play field starts below it, never under it. -->
  <header id="topbar">
    <div id="mode-banner" class="mode-practice">practice</div>
    <div id="mode-help"></div>
    <div id="cfg">
      <div id="res-info"></div>
      <button type="button" class="act click" data-act="settings"><span class="chip">⚙</span><span class="lbl">settings</span></button>
    </div>
    <div id="hud" aria-live="off">
      <div id="hud-spark" class="hud-spark-host"></div>
      <div id="hud-metrics">
        <div id="hud-bps">0.0 <span class="hud-unit">bits/s</span></div>
        <div id="hud-time"></div>
        <div id="hud-counts"></div>
      </div>
    </div>
  </header>
  <!-- Mode + controls live together in one corner cluster: the chip says
       which mode is active (spec §5: unmistakable, not shouty), the lines
       under it are the actions — clickable, with their hotkeys. -->
  <div id="caps-warning" hidden>⇪ Caps Lock is on — input is case-folded, but turn it off</div>
  <div id="ime-warning" hidden>An IME composition was detected — scored runs need direct key input</div>

  <main id="stage">
    <div id="stream-viewport">
      <div id="caret"></div>
      <div id="stream"></div>
      <div id="fade-left"></div>
    </div>
    <div id="hint">type the letter at the caret · miss → backspace → retype</div>
    <div id="notice" hidden></div>
  </main>

  <!-- Results view (spec §8): headline bps + server-computed diagnostics.
       The metrics come from the result record, so any environment emitting
       the standard selection log renders the same panels. -->
  <section id="results" hidden>
    <div id="res-hero"></div>
    <div id="res-tiles"></div>
    <div id="res-charts">
      <figure>
        <figcaption>pace — net bits/s per 5&thinsp;s <span class="err-key">▎misses</span></figcaption>
        <div id="chart-pace"></div>
      </figure>
      <figure>
        <figcaption>gap between selections</figcaption>
        <div id="chart-iki"></div>
      </figure>
    </div>
    <div id="res-footer">
      <button type="button" class="act click" data-act="arm"><kbd>Enter</kbd>new scored run</button>
      <button type="button" class="act click" data-act="seed"><kbd>Esc</kbd>back to practice</button>
      <button type="button" class="act click" data-act="settings"><span class="chip">⚙</span>settings</button>
    </div>
  </section>

  <!-- Overlay card: error states only. -->
  <div id="overlay" hidden>
    <div id="card"></div>
  </div>

  <!-- Settings: behind a gear, out of the fixation path (spec §9 step 5).
       Every change restarts the practice bout under a new content-addressed
       config; scored runs report whatever config is active. -->
  <a id="gallery-link" href="/env/" title="back to all games">← gallery</a>
  <div id="sheet">
    <div class="sh-row">
      <span class="sh-label">alphabet</span>
      <div class="seg" id="seg-alphabet">
        <button data-v="abcdefghijklmnopqrstuvwxyz">a–z</button>
        <button data-v="abcdefghijklmnopqrstuvwxyz0123456789">a–z 0–9</button>
        <button data-v="asdfghjkl">home row</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">lookahead</span>
      <input type="range" id="set-lookahead" min="1" max="16" step="1">
      <span id="lookahead-val" class="sh-val"></span>
    </div>
    <div class="sh-row">
      <span class="sh-label">chunking</span>
      <div class="seg" id="seg-chunk">
        <button data-v="">off</button>
        <button data-v="3">3</button>
        <button data-v="4">4</button>
        <button data-v="5">5</button>
        <button data-v="6">6</button>
        <button data-v="7">7</button>
        <button data-v="8">8</button>
      </div>
    </div>
    <div class="sh-row">
      <span class="sh-label">error sound</span>
      <div class="seg" id="seg-audio">
        <button data-v="">off</button>
        <button data-v="1">on</button>
      </div>
    </div>
    <div class="sh-foot" id="sheet-info"></div>
  </div>

<script src="../common/results.js"></script>
<script src="game.js"></script>
</body>
</html>
