<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — gallery</title>
<link rel="stylesheet" href="gallery.css">
<link rel="stylesheet" href="common/results.css">
</head>
<body>
  <header>
    <h1>bit-rate games</h1>
  </header>

  <section id="tiles"></section>

  <section id="board-section">
    <h2>leaderboard <span id="board-note" class="note"></span></h2>
    <div id="board-tabs"></div>
    <div id="board"></div>
  </section>

  <section id="progress-section" hidden>
    <h2>your progress</h2>
    <div id="progress"></div>
  </section>

  <!-- The graveyard: built, played, and beaten by something above. Kept
       because a mode that didn't work is a result too — but out of the
       leaderboard, which ranks the games still in the running. -->
  <section id="graveyard-section" hidden>
    <h2>graveyard <span class="note">— tried, kept for the record, out of the running</span></h2>
    <div id="graveyard"></div>
  </section>

  <!-- The submission is this site (spec §8): the game is the deployed web app,
       and these two links are the rest of the deliverable — the design
       rationale the brief asks for, and the source. The README is self-hosted
       as well as visible on GitHub so it works before anyone clicks out. -->
  <footer id="gal-foot">
    <a href="/readme">design notes</a>
    <span class="sep">·</span>
    <a href="https://github.com/maxbates/bitrate" target="_blank" rel="noopener">source on GitHub</a>
    <span class="sep">·</span>
    <a href="/env/drum-pad/">play drum pad</a>
  </footer>

<script src="common/results.js"></script>
<script src="gallery.js"></script>
</body>
</html>
