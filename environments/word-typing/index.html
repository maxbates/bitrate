<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-rate — word typing</title>
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="../common/results.css">
</head>
<body>
  <div id="corner">
    <div id="mode-banner" class="mode-practice">practice</div>
    <div id="mode-help"></div>
    <div class="off-brief-banner">off-brief: word-level targets are banned by the brief (rule 1) — lab experiment only, never a grading candidate</div>
  </div>

  <div id="hud">
    <div id="hud-bps">0.0 <span class="hud-unit">bits/s</span></div>
    <div id="hud-time"></div>
    <div id="hud-counts"></div>
  </div>

  <main id="stage">
    <div id="chips"></div>
    <div id="buffer-row"><span id="buffer"></span><span id="buffer-caret"></span></div>
    <div id="hint">type the word · <b>space</b> commits the selection · backspace edits freely before commit</div>
    <div id="notice" hidden></div>
  </main>

  <section id="results" hidden>
    <div id="res-hero"></div>
    <div id="res-tiles"></div>
    <div id="res-charts">
      <figure>
        <figcaption>pace — net bits/s per 5&thinsp;s <span class="err-key">▎misses</span></figcaption>
        <div id="chart-pace"></div>
      </figure>
      <figure>
        <figcaption>gap between selections</figcaption>
        <div id="chart-iki"></div>
      </figure>
    </div>
    <div id="res-footer">press <b>Enter</b> for a new scored run · <b>Esc</b> for practice</div>
  </section>

  <div id="overlay" hidden>
    <div id="card"></div>
  </div>

  <button id="gear" title="settings">⚙ settings</button>
  <div id="sheet">
    <div class="sh-row">
      <span class="sh-label">max length</span>
      <div class="seg" id="seg-len">
        <button data-v="3">3 letters</button>
        <button data-v="4">4 letters</button>
        <button data-v="5">5 letters</button>
      </div>
    </div>
    <div class="sh-foot" id="sheet-info"></div>
  </div>

<script src="../common/words.js"></script>
<script src="../common/results.js"></script>
<script src="game.js"></script>
</body>
</html>
